<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" width="640" height="800" role="img" aria-label="Portrait placeholder — formal studio silhouette">
  <!-- ==========================================================
       PROFILE PLACEHOLDER
       Shown only until assets/images/profile.jpg exists.
       Formal studio silhouette: black suit jacket, white collar,
       champagne-gold backdrop wash — matches the site's grading.
       ========================================================== -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%"   stop-color="#16161a"/>
      <stop offset="55%"  stop-color="#0d0d10"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>

    <radialGradient id="wash" cx="50%" cy="26%" r="70%">
      <stop offset="0%"   stop-color="#C9A227" stop-opacity="0.30"/>
      <stop offset="60%"  stop-color="#7A5E12" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="suit" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%"   stop-color="#1c1c22"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>

    <linearGradient id="skin" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%"   stop-color="#3a3a42"/>
      <stop offset="100%" stop-color="#212128"/>
    </linearGradient>

    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#C9A227" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#C9A227" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Backdrop -->
  <rect width="640" height="800" fill="url(#bg)"/>
  <rect width="640" height="800" fill="url(#wash)"/>

  <!-- Subtle studio floor line -->
  <ellipse cx="320" cy="742" rx="250" ry="46" fill="#000" opacity="0.55"/>

  <!-- Shoulders / suit jacket -->
  <path d="M320 452
           c -104 0 -186 54 -206 128
           l -22 220 h 456 l -22 -220
           c -20 -74 -102 -128 -206 -128 Z"
        fill="url(#suit)"/>

  <!-- Lapels -->
  <path d="M320 466 L262 486 L292 640 L320 520 Z" fill="#000" opacity="0.72"/>
  <path d="M320 466 L378 486 L348 640 L320 520 Z" fill="#000" opacity="0.72"/>

  <!-- Shirt collar -->
  <path d="M320 452 L286 470 L320 528 L354 470 Z" fill="#dcdce2" opacity="0.9"/>
  <path d="M320 528 L306 476 L320 470 L334 476 Z" fill="#C9A227" opacity="0.85"/>

  <!-- Neck -->
  <path d="M282 392 h76 v70 c 0 22 -76 22 -76 0 Z" fill="url(#skin)"/>

  <!-- Head -->
  <ellipse cx="320" cy="290" rx="104" ry="126" fill="url(#skin)"/>

  <!-- Hair -->
  <path d="M320 158
           c -74 0 -114 50 -114 116
           c 0 22 6 44 6 44
           c 4 -58 26 -92 46 -102
           c 30 -16 94 -18 132 6
           c 20 12 32 46 36 96
           c 0 0 8 -22 8 -44
           c 0 -66 -40 -116 -114 -116 Z"
        fill="#111116"/>
  <path d="M206 274 c -6 90 6 152 26 190 c -34 -30 -46 -110 -40 -196 Z" fill="#111116"/>
  <path d="M434 274 c 6 90 -6 152 -26 190 c 34 -30 46 -110 40 -196 Z" fill="#111116"/>

  <!-- Rim light on the left edge -->
  <path d="M216 250 c -8 60 -2 118 14 158 l 10 -6 c -16 -40 -20 -96 -12 -152 Z" fill="url(#rim)"/>

  <!-- Vignette -->
  <rect width="640" height="800" fill="none"/>
  <path d="M0 0 h640 v800 H0 Z" fill="none"/>
  <rect width="640" height="800" fill="url(#wash)" opacity="0.25"/>

  <!-- Caption -->
  <text x="320" y="770" text-anchor="middle"
        font-family="'JetBrains Mono', ui-monospace, monospace"
        font-size="15" letter-spacing="4" fill="#5e5e68">
    ADD assets/images/profile.jpg
  </text>
</svg>
